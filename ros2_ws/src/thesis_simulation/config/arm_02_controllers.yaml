"/arm_02/arm_02_controller_manager":
  ros__parameters:
    update_rate: 100
    arm_02_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_02_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
"/arm_02/arm_02_arm_controller":
  ros__parameters:
    joints: [arm_02_jaco_joint_1, arm_02_jaco_joint_2, arm_02_jaco_joint_3,
             arm_02_jaco_joint_4, arm_02_jaco_joint_5, arm_02_jaco_joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: true
