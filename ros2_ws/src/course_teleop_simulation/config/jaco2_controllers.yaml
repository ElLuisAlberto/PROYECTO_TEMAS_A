controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - j2n6s300_joint_1
      - j2n6s300_joint_2
      - j2n6s300_joint_3
      - j2n6s300_joint_4
      - j2n6s300_joint_5
      - j2n6s300_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    # The Cartesian bridge sends a short rolling horizon at 20 Hz. Open-loop
    # continuity prevents the trajectory controller from restarting every
    # waypoint and matches the Jaco2 simulation control contract.
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
